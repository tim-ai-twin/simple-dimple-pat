openapi: "3.0.3"
info:
  title: SDP Test API
  version: "1.0.0"
  description: Custom API spec for parameter constraint testing.
servers:
  - url: https://api.example.com/v1
tags:
  - name: repositories
    description: Repository operations
  - name: orgs
    description: Organization operations
paths:
  /repos/{owner}/{repo}:
    get:
      tags:
        - repositories
      summary: Get a repository
      operationId: getRepo
      parameters:
        - name: owner
          in: path
          required: true
          description: The repository owner
          schema:
            type: string
        - name: repo
          in: path
          required: true
          description: The repository name
          schema:
            type: string
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "404":
          description: Repository not found
      security:
        - bearerAuth: []
    delete:
      tags:
        - repositories
      summary: Delete a repository
      operationId: deleteRepo
      parameters:
        - name: owner
          in: path
          required: true
          description: The repository owner
          schema:
            type: string
        - name: repo
          in: path
          required: true
          description: The repository name
          schema:
            type: string
      responses:
        "204":
          description: Repository deleted
        "404":
          description: Repository not found
      security:
        - bearerAuth: []
  /repos/{owner}/{repo}/issues:
    get:
      tags:
        - repositories
      summary: List repository issues
      operationId: listRepoIssues
      parameters:
        - name: owner
          in: path
          required: true
          description: The repository owner
          schema:
            type: string
        - name: repo
          in: path
          required: true
          description: The repository name
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Filter issues by state
          schema:
            type: string
            enum:
              - open
              - closed
              - all
      responses:
        "200":
          description: A list of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "404":
          description: Repository not found
      security:
        - bearerAuth: []
    post:
      tags:
        - repositories
      summary: Create an issue
      operationId: createRepoIssue
      parameters:
        - name: owner
          in: path
          required: true
          description: The repository owner
          schema:
            type: string
        - name: repo
          in: path
          required: true
          description: The repository name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Repository not found
      security:
        - bearerAuth: []
  /orgs/{org}/members:
    get:
      tags:
        - orgs
      summary: List organization members
      operationId: listOrgMembers
      parameters:
        - name: org
          in: path
          required: true
          description: The organization name
          schema:
            type: string
      responses:
        "200":
          description: A list of organization members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "404":
          description: Organization not found
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Repository:
      type: object
      required:
        - id
        - name
        - owner
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        owner:
          type: string
        description:
          type: string
        private:
          type: boolean
    Issue:
      type: object
      required:
        - id
        - title
        - state
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum:
            - open
            - closed
    IssueInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        body:
          type: string
    Member:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - member
